<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>小智選股系統</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:dark;
  --bg:#0b1220; --panel:#131c2b; --card:#1b2635; --line:#26344a;
  --text:#e6edf6; --muted:#8fa0b8; --dim:#64748b;
  --accent:#3b82f6; --accent-soft:rgba(59,130,246,.14);
  --up:#ef4444; --down:#22c55e; --star:#fbbf24;
}
body{font-family:-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);font-size:15px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.wrap{display:flex;gap:12px;padding:12px;max-width:1800px;margin:0 auto}
.left{width:420px;flex-shrink:0}
.right{flex:1;min-width:0}
h1{font-size:19px;margin-bottom:2px;letter-spacing:.5px}
.sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}

.cond{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.cond:last-child{border-bottom:none}
.cond input{width:18px;height:18px;margin-top:1px;accent-color:var(--accent);flex-shrink:0}
.cond .t{font-weight:600;font-size:14px}
.cond .d{font-size:11px;color:var(--muted);margin-top:2px}
.cond .n{margin-left:auto;font-size:11px;color:var(--dim);padding-top:2px}
.grp{border-bottom:1px solid var(--line)}
.grp:last-child{border:none}
.grp-h{display:flex;align-items:center;gap:8px;padding:11px 0;cursor:pointer;user-select:none}
.grp-h .arrow{font-size:10px;color:var(--dim);transition:.15s;width:10px}
.grp-h.open .arrow{transform:rotate(90deg)}
.grp-h .t{font-weight:600;font-size:14px}
.grp-h .n{margin-left:auto;font-size:11px;color:var(--dim)}
.grp-body{display:none;padding:0 0 10px 18px}
.grp-body.open{display:block}
.sub-cond{display:flex;align-items:flex-start;gap:9px;padding:7px 0;cursor:pointer}
.sub-cond input{width:17px;height:17px;margin-top:1px;accent-color:var(--accent);flex-shrink:0}
.sub-cond .t{font-size:13px;font-weight:500}
.sub-cond .d{font-size:10.5px;color:var(--muted)}
.sub-cond .n{margin-left:auto;font-size:11px;color:var(--dim)}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 10px 18px}
.pill{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px 11px;cursor:pointer;font-size:12.5px}
.pill input{width:14px;height:14px;accent-color:var(--accent)}
.pill .n{color:var(--dim);font-size:10.5px}

.bar{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 16px -6px rgba(59,130,246,.6)}
.bar b{font-size:22px}
.bar button{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:8px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.bar button:hover{background:rgba(255,255,255,.28)}
.bar button.on{background:#fff;color:#2563eb;border-color:#fff;font-weight:700}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--card);padding:9px 7px;text-align:left;color:var(--muted);font-size:11px;font-weight:600;border-bottom:1px solid var(--line)}
td{padding:9px 7px;border-bottom:1px solid var(--line)}
tbody tr{cursor:pointer;transition:.12s}
tbody tr:hover{background:var(--card)}
tbody tr.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.id{font-weight:700;color:var(--accent)}
.nm{font-size:11px;color:var(--muted)}
.rs{font-weight:700;text-align:right}
.px{text-align:right}
.empty{text-align:center;color:var(--dim);padding:36px 0}
.ph{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:100px 20px;text-align:center;color:var(--dim)}

th.stcol,td.stcol{width:30px;padding-left:9px;padding-right:0;text-align:center}
.star{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;
  font-size:16px;color:#3a4a63;cursor:pointer;border-radius:50%;user-select:none;transition:.12s}
.star:hover{background:rgba(251,191,36,.15);color:var(--star)}
.star.on{color:var(--star)}
th.sortable{text-align:right;cursor:pointer;user-select:none;transition:.12s}
th.sortable:hover{color:var(--text)}
th.sortable.asc::after{content:"▲";font-size:8px;margin-left:4px}
th.sortable.desc::after{content:"▼";font-size:8px;margin-left:4px}

.ct{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.ct h2{font-size:18px}
.ct .p{font-size:22px;font-weight:700}
.cmeta{font-size:11.5px;color:var(--muted);margin:3px 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--accent-soft);color:#7ab0ff;font-weight:600;border:1px solid rgba(59,130,246,.3)}
.tag.off{background:var(--card);color:var(--dim);border-color:var(--line)}
.up{color:var(--up)}.dn{color:var(--down)}

.maintabs{display:flex;gap:8px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.maintabs button{background:none;border:none;padding:9px 4px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.maintabs button.act{color:var(--accent);border-bottom-color:var(--accent)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tools button{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:600}
.tools button:hover{border-color:var(--accent);color:var(--text)}
.tools button.act{background:var(--accent);color:#fff;border-color:var(--accent)}
.malist{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mapill{display:flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:16px;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:600;user-select:none;background:var(--card)}
.mapill input{width:13px;height:13px;accent-color:currentColor}

/* 手機：垂直滑動交給頁面，水平拖曳才給圖表 */
.chart{position:relative;touch-action:pan-y}
.chart>div{touch-action:pan-y}
.legend{position:absolute;top:6px;left:8px;z-index:3;font-size:12px;color:var(--muted);background:rgba(11,18,32,.85);padding:3px 7px;border-radius:5px;pointer-events:none;line-height:1.6}

.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;margin-bottom:10px;background:var(--card);color:var(--text)}
.search::placeholder{color:var(--dim)}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbox{position:relative;margin-bottom:10px}
.searchbox .search{margin-bottom:0;padding-right:34px}
.clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:none;background:var(--line);color:var(--muted);border-radius:50%;font-size:14px;line-height:1;cursor:pointer;display:none;padding:0}
.clr.on{display:block}

#close{display:none}
.fs .right{position:fixed;inset:0;z-index:200;background:var(--bg);padding:12px;overflow-y:auto;width:100%}
.fs .left{display:none}

.sectitle{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.fintable{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.fintable th{background:var(--card);padding:6px;text-align:right;color:var(--muted);font-size:10.5px}
.fintable th:first-child{text-align:left}
.fintable td{padding:6px;text-align:right;border-bottom:1px solid var(--line)}
.fintable td:first-child{text-align:left;font-weight:600}
.tip{font-size:15px;color:var(--text);margin-top:8px;min-height:20px;font-weight:500;padding:9px 11px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.tip b{font-size:16px}
.dedrow{position:relative;height:20px;overflow:hidden;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.dedtri{position:absolute;top:3px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;transform:translateX(-50%)}

@media(max-width:900px){
 .wrap{flex-direction:column;padding:10px}
 .tools{gap:4px;margin-bottom:6px}
 .tools button{padding:6px 10px;font-size:12px;border-radius:6px}
 .tools button.fsbtn{font-size:16px;padding:4px 12px;background:var(--accent);color:#fff;font-weight:400;border-color:var(--accent)}
 .tools .sep{width:1px;height:20px;background:var(--line);margin:0 3px;align-self:center}
 .malist{gap:4px;margin-bottom:6px}
 .mapill{padding:4px 8px;font-size:11.5px;border-width:1px}
 .mapill input{width:11px;height:11px}
 .maintabs{margin-bottom:8px}
 .left{width:100%;display:flex;flex-direction:column}
 .left>h1{order:1}
 .left>.sub{order:2}
 .left>.searchbox{order:3}
 .left>.bar{order:4;position:sticky;top:0;z-index:50}
 .left>#conds{order:5}
 .left>.box:last-child{order:6;margin-top:14px}
 .right{position:fixed;bottom:0;left:0;right:0;height:88vh;overflow-y:auto;background:var(--bg);padding:10px;z-index:99;box-shadow:0 -3px 24px rgba(0,0,0,.6);border-radius:16px 16px 0 0;transform:translateY(100%);transition:.25s;border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
 .right.show{transform:translateY(0)}
 #close{display:block;position:fixed;top:14px;right:16px;background:var(--card);border:1px solid var(--line);border-radius:50%;width:34px;height:34px;font-size:19px;cursor:pointer;color:var(--text);z-index:101}
 .tip{font-size:16px;padding:10px 12px}
 .tip b{font-size:18px}
 .legend{font-size:13px}
 .sectitle{font-size:14px}
 .fintable{font-size:13.5px}
 .star{width:30px;height:30px;line-height:30px;font-size:18px}
}
</style>
</head>
<body>
<div class="wrap" id="wrap">
<div class="left">
  
   <h1>小智選股系統</h1>
   <div class="sub" id="meta">載入中…</div>
    <div class="searchbox">
    <input class="search" id="kw" placeholder="輸入代號或名稱搜尋…" oninput="render()">
    <button class="clr" id="clrBtn" onclick="clearKw()">×</button>
  </div>
  
  <div class="box" id="conds"></div>
  <div class="bar">
    <div>符合條件<br><b id="cnt">0</b> 檔</div>
    <button id="favBtn" onclick="toggleFavOnly()">★ 自選 <span id="favCnt">0</span></button>
  </div>
  <div class="box" style="padding:0;overflow:hidden">
    <table>
         <thead><tr><th class="stcol"></th><th>代碼/名稱</th>
        <th class="sortable" id="th-close" onclick="sortBy('close')">股價</th>
        <th class="sortable desc" id="th-rs_score" onclick="sortBy('rs_score')">RS</th>
        <th class="sortable" id="th-vol20" onclick="sortBy('vol20')">均量</th></tr></thead>
      <tbody id="tb"><tr><td colspan="5" class="empty">載入中…</td></tr></tbody>
    </table>
  </div>
</div>
<div class="right" id="panel">
  <button id="close" onclick="closePanel()">×</button>
  <div id="detail"><div class="ph">點選左側股票查看技術線圖</div></div>
</div>
</div>

<script>
const STRUCT=[
 {type:"single",k:"c1",t:"RS 指標大於 90",d:"全市場強度排名前 10%",s:"RS≥90"},
 {type:"group",id:"gHigh",t:"高點類",items:[
   {k:"c2",t:"距離上個月高點不遠",d:"收盤 ≥ 上月最高價 × 0.95",s:"近月高"},
   {k:"over_month",t:"過上個月高點",d:"今日收盤 > 上月最高價",s:"破月高"},
   {k:"over_week",t:"過上週高點",d:"今日收盤 > 上週最高價",s:"破週高"},
 ]},
 {type:"group",id:"gMa",t:"均線類",items:[
   {k:"c3",t:"短期均線排列正確",d:"MA5 > MA10 > MA24",s:"短多"},
   {k:"c4",t:"中長期均線排列正確",d:"MA24 > MA72 > MA200",s:"長多"},
   {k:"cross",t:"5T 穿越 24T",d:"今日剛發生黃金交叉",s:"金叉"},
 ]},
 {type:"pills",t:"站上扣抵值",items:[
   {k:"d5",label:"5T",s:"扣5"},
   {k:"d10",label:"10T",s:"扣10"},
   {k:"d24",label:"24T",s:"扣24"},
   {k:"d72",label:"72T",s:"扣72"},
 ]},
 {type:"group",id:"gInst",t:"籌碼面",items:[
   {k:"foreign_buy",t:"外資買超",d:"最新一日外資買賣超為正",s:"外資買"},
   {k:"trust_buy",t:"投信買超",d:"最新一日投信買賣超為正",s:"投信買"},
   {k:"foreign_high",t:"外資持股創一季新高",d:"外資持股比例為近60交易日最高",s:"外資高"},
 ]},
 {type:"single",k:"vol",t:"排除低量股",d:"20 日均量 ≥ 500 張",s:"量"},
];
const SMAP={};
STRUCT.forEach(g=>{
  if(g.type==="single")SMAP[g.k]=g.s;
  else g.items.forEach(i=>SMAP[i.k]=i.s);
});

const MA_OPTIONS=[
  [5,"#e2e8f0",true],
  [10,"#fb923c",false],
  [24,"#38bdf8",true],
  [72,"#4ade80",false],
  [200,"#c084fc",false],
];
let maOn=new Set(MA_OPTIONS.filter(m=>m[2]).map(m=>m[0]));

const PERIOD_LABEL={D:"日",W:"週",M:"月"};

let DATA=[],sel=new Set(),shown=[],cur=null,raw=null;
let period="D",sub="KD",charts=[],fs=false;
let openGrp=new Set();
let DATA_DATE=null;
let mainTab="chart";
let fundData=null;
let savedRange=null;
let sortKey="rs_score",sortDir="desc";
function sortBy(k){
  if(sortKey===k)sortDir=sortDir==="desc"?"asc":"desc";
  else{sortKey=k;sortDir="desc"}
  render();
}

/* ── 自選股：存在這台裝置的瀏覽器裡，每個人各自獨立 ── */
let fav=new Set();
let favOnly=false;
try{fav=new Set(JSON.parse(localStorage.getItem("favStocks")||"[]"));}catch(e){fav=new Set();}
function saveFav(){
  try{localStorage.setItem("favStocks",JSON.stringify([...fav]));}catch(e){}
  const el=document.getElementById("favCnt");
  if(el)el.textContent=fav.size;
}
function toggleFav(id,ev){
  if(ev){ev.stopPropagation();}
  fav.has(id)?fav.delete(id):fav.add(id);
  saveFav();
  const st=document.getElementById("st"+id);
  if(st)st.classList.toggle("on",fav.has(id));
  if(favOnly)render();
}
function toggleFavOnly(){
  favOnly=!favOnly;
  document.getElementById("favBtn").classList.toggle("on",favOnly);
  render();
}

fetch("screener_data.json?"+Date.now()).then(r=>r.json()).then(j=>{
  DATA=j.stocks;
  DATA_DATE=j.updated;
  document.getElementById("meta").textContent=`資料日期 ${j.updated} 共 ${j.count} 檔`;
  saveFav();
  buildConds();render();
}).catch(()=>{document.getElementById("meta").textContent="資料載入失敗"});

function pass(s,k){return k==="vol"?s.vol20>=500:s[k]}
function cnt(k){return DATA.filter(s=>pass(s,k)).length}

function buildConds(){
  const html=STRUCT.map(g=>{
    if(g.type==="single"){
      return `<label class="cond"><input type="checkbox" data-k="${g.k}">
        <div><div class="t">${g.t}</div><div class="d">${g.d}</div></div>
        <div class="n">${cnt(g.k)}</div></label>`;
    }
    if(g.type==="pills"){
      return `<div class="grp-h" style="cursor:default"><div class="t">${g.t}</div></div>
        <div class="pillrow">${g.items.map(i=>
          `<label class="pill"><input type="checkbox" data-k="${i.k}">${i.label}<span class="n">${cnt(i.k)}</span></label>`
        ).join("")}</div>`;
    }
    const isOpen=openGrp.has(g.id);
    return `<div class="grp">
      <div class="grp-h${isOpen?" open":""}" data-g="${g.id}">
        <span class="arrow">▸</span><div class="t">${g.t}</div><div class="n">${g.items.length} 項</div>
      </div>
      <div class="grp-body${isOpen?" open":""}" id="body-${g.id}">
        ${g.items.map(i=>`<label class="sub-cond"><input type="checkbox" data-k="${i.k}">
          <div><div class="t">${i.t}</div><div class="d">${i.d}</div></div>
          <div class="n">${cnt(i.k)}</div></label>`).join("")}
      </div>
    </div>`;
  }).join("");
  document.getElementById("conds").innerHTML=html;

  document.querySelectorAll(".grp-h[data-g]").forEach(el=>{
    el.onclick=()=>{
      const id=el.dataset.g;
      openGrp.has(id)?openGrp.delete(id):openGrp.add(id);
      buildConds();
    };
  });
  document.querySelectorAll("input[type=checkbox][data-k]").forEach(el=>{
    el.checked=sel.has(el.dataset.k);
    el.onchange=()=>{el.checked?sel.add(el.dataset.k):sel.delete(el.dataset.k);render()};
  });
}
function clearKw(){
  document.getElementById("kw").value="";
  render();
}
function render(){
  const kw=(document.getElementById("kw")?.value||"").trim().toLowerCase();
  document.getElementById("clrBtn")?.classList.toggle("on",!!kw);

  if(favOnly){
    shown=DATA.filter(s=>fav.has(s.stock_id));
    if(kw)shown=shown.filter(s=>s.stock_id.toLowerCase().includes(kw)||(s.stock_name||"").toLowerCase().includes(kw));
  }else{
    shown=kw
      ? DATA.filter(s=>s.stock_id.toLowerCase().includes(kw)||(s.stock_name||"").toLowerCase().includes(kw))
      : DATA.filter(s=>[...sel].every(k=>pass(s,k)));
  }
  shown=[...shown].sort((a,b)=>{
    const x=Number(a[sortKey])||0, y=Number(b[sortKey])||0;
    return sortDir==="desc"?y-x:x-y;
  });
  ["close","rs_score","vol20"].forEach(k=>{
    const el=document.getElementById("th-"+k);
    if(el)el.className="sortable"+(sortKey===k?" "+sortDir:"");
  });
  document.getElementById("cnt").textContent=shown.length;
  const tb=document.getElementById("tb");

  if(favOnly&&!shown.length){
    tb.innerHTML='<tr><td colspan="5" class="empty">尚未加入自選股<br><span style="font-size:12px">點列表左邊的 ☆ 加入</span></td></tr>';return
  }
  if(!favOnly&&!sel.size&&!kw){tb.innerHTML='<tr><td colspan="5" class="empty">請勾選條件</td></tr>';return}
  if(!shown.length){tb.innerHTML='<tr><td colspan="5" class="empty">無符合條件的股票</td></tr>';return}

  tb.innerHTML=shown.slice(0,300).map(s=>`<tr onclick="pick('${s.stock_id}')" id="r${s.stock_id}">
    <td class="stcol"><span class="star${fav.has(s.stock_id)?" on":""}" id="st${s.stock_id}"
      onclick="toggleFav('${s.stock_id}',event)">${fav.has(s.stock_id)?"★":"☆"}</span></td>
    <td><span class="id">${s.stock_id}</span> <span class="nm">${s.stock_name}</span></td>
    <td class="px">${s.close}</td><td class="rs">${s.rs_score}</td>
    <td class="px nm">${s.vol20>=1000?Math.round(s.vol20/1000)+"K":Math.round(s.vol20)}</td></tr>`).join("");

    if(kw&&shown.length===1&&(!cur||cur.stock_id!==shown[0].stock_id)){
    pick(shown[0].stock_id);
  }
}

function pick(id){
  document.querySelectorAll("tbody tr").forEach(r=>r.classList.remove("on"));
  const row=document.getElementById("r"+id); if(row)row.classList.add("on");
  cur=DATA.find(s=>s.stock_id===id);
  mainTab="chart";
  fundData=null;
  savedRange=null;
  document.getElementById("panel").classList.add("show");
  document.getElementById("detail").innerHTML='<div class="ph">載入中…</div>';
  fetch("chart/"+id+".json?"+Date.now())
    .then(r=>r.json())
    .then(d=>{
      if(cur && cur.stock_id !== id) return;
      raw=d;build()
    })
   .catch(()=>{
     if(cur && cur.stock_id !== id) return;
     document.getElementById("detail").innerHTML='<div class="ph">找不到線圖資料</div>'
   });
}
function closePanel(){
  fs=false;
  document.getElementById("wrap").classList.remove("fs");
  document.getElementById("panel").classList.remove("show");
}
function toBars(d){
  const endY = DATA_DATE ? parseInt(DATA_DATE.slice(0,4)) : new Date().getFullYear();
  let py=null,yr=endY;
  const out=[];
  for(let i=d.d.length-1;i>=0;i--){
    const [m,dd]=d.d[i].split("-").map(Number);
    if(py!==null&&m>py)yr--;
    py=m;
    out.unshift({time:`${yr}-${String(m).padStart(2,"0")}-${String(dd).padStart(2,"0")}`,
      open:d.o[i],high:d.h[i],low:d.l[i],close:d.c[i],volume:d.v[i]});
  }
  return out;
}
function toWeek(bars){
  const out=[];let cw=null;
  bars.forEach(b=>{
    const dt=new Date(b.time),day=dt.getDay();
    const mon=new Date(dt);mon.setDate(dt.getDate()-(day===0?6:day-1));
    const key=mon.toISOString().slice(0,10);
    if(!cw||cw.time!==key){cw={time:key,open:b.open,high:b.high,low:b.low,close:b.close,volume:b.volume};out.push(cw)}
    else{cw.high=Math.max(cw.high,b.high);cw.low=Math.min(cw.low,b.low);cw.close=b.close;cw.volume+=b.volume}
  });
  return out;
}
function toMonth(bars){
  const out=[];let cm=null;
  bars.forEach(b=>{
    const key=b.time.slice(0,7)+"-01";
    if(!cm||cm.time!==key){cm={time:key,open:b.open,high:b.high,low:b.low,close:b.close,volume:b.volume};out.push(cm)}
    else{cm.high=Math.max(cm.high,b.high);cm.low=Math.min(cm.low,b.low);cm.close=b.close;cm.volume+=b.volume}
  });
  return out;
}
const MA=(a,n)=>a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n);

function calcKD(b,n=9){
  const k=[],d=[];let pk=50,pd=50;
  b.forEach((x,i)=>{
    const s=b.slice(Math.max(0,i-n+1),i+1);
    const hi=Math.max(...s.map(v=>v.high)),lo=Math.min(...s.map(v=>v.low));
    const rsv=hi===lo?50:(x.close-lo)/(hi-lo)*100;
    pk=pk*2/3+rsv/3;pd=pd*2/3+pk/3;
    k.push(pk);d.push(pd);
  });
  return {k,d};
}
function ema(a,n){const kk=2/(n+1);let p=a[0];return a.map((v,i)=>i===0?v:(p=v*kk+p*(1-kk)))}
function calcMACD(c){
  const f=ema(c,12),s=ema(c,26),dif=f.map((v,i)=>v-s[i]);
  const dea=ema(dif,9);
  return {dif,dea,osc:dif.map((v,i)=>v-dea[i])};
}
function calcRSI(c,n=14){
  const out=[50];let ag=0,al=0;
  for(let i=1;i<c.length;i++){
    const ch=c[i]-c[i-1],g=Math.max(ch,0),l=Math.max(-ch,0);
    if(i<=n){ag=(ag*(i-1)+g)/i;al=(al*(i-1)+l)/i}
    else{ag=(ag*(n-1)+g)/n;al=(al*(n-1)+l)/n}
    out.push(al===0?100:100-100/(1+ag/al));
  }
  return out;
}

function bakBars(){
  if(period==="W")return toWeek(toBars(raw));
  if(period==="M")return toMonth(toBars(raw));
  return toBars(raw);
}

function drawRevenueChart(rev){
  const box=document.getElementById("fc1");
  if(!rev.length){box.innerHTML='<div class="ph">無營收資料</div>';return}
  const W=520,H=230,PL=52,PR=15,PT=20,PB=34;
  const labels=rev.map(r=>`${r.y}/${String(r.m).padStart(2,"0")}`);
  const bars=rev.map(r=>r.rev/1e8);
  const yoy=rev.map(r=>r.yoy);
  const maxBar=Math.max(...bars,1);
  const validYoy=yoy.filter(v=>v!=null);
  const maxYoy=validYoy.length?Math.max(...validYoy,10):10;
  const minYoy=validYoy.length?Math.min(...validYoy,-10):-10;
  const n=rev.length;
  const bw=(W-PL-PR)/n*0.6;
  const X=i=>PL+(i+0.5)*(W-PL-PR)/n;
  const YB=v=>H-PB-v/maxBar*(H-PT-PB);
  const YL=v=>H-PB-(v-minYoy)/(maxYoy-minYoy||1)*(H-PT-PB);

  let bars_svg="",line_pts=[];
  for(let i=0;i<n;i++){
    const x=X(i);
    bars_svg+=`<rect x="${x-bw/2}" y="${YB(bars[i])}" width="${bw}" height="${H-PB-YB(bars[i])}" fill="#c9c2f0"/>`;
    if(yoy[i]!=null)line_pts.push(`${x},${YL(yoy[i])}`);
  }
  let xlabels="";
  for(let i=0;i<n;i+=Math.ceil(n/6)){
    xlabels+=`<text x="${X(i)}" y="${H-8}" font-size="11" fill="#9aa0a8" text-anchor="middle">${labels[i]}</text>`;
  }
  let leftAxis="";
  for(let i=0;i<=3;i++){
    const v=maxBar*i/3, y=YB(v);
    leftAxis+=`<text x="${PL-7}" y="${y+4}" font-size="11" fill="#9aa0a8" text-anchor="end">${v>=1?v.toFixed(0):v.toFixed(1)}</text>
               <line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#1e2a3d"/>`;
  }
  const zeroY=YL(0);
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;cursor:crosshair" id="revSvg">
    ${leftAxis}
    <line x1="${PL}" y1="${zeroY}" x2="${W-PR}" y2="${zeroY}" stroke="#f0c0c0" stroke-dasharray="3,3"/>
    <g>${bars_svg}</g>
    <polyline points="${line_pts.join(" ")}" fill="none" stroke="#d64545" stroke-width="2.2"/>
    ${xlabels}
    <text x="${PL}" y="14" font-size="12" fill="#8b7cd8" font-weight="700">■ 單月營收(億)</text>
    <text x="${PL+98}" y="14" font-size="12" fill="#d64545" font-weight="700">— YoY年增率%</text>
    <line id="revCross" x1="0" y1="${PT}" x2="0" y2="${H-PB}" stroke="#c0c4cb" stroke-width="1" style="display:none"/>
  </svg>
  <div id="revTip" class="tip">滑過圖表查看數值</div>`;

  const svgEl=document.getElementById("revSvg");
  function moveHandler(clientX){
    const rect=svgEl.getBoundingClientRect();
    const scaleX=W/rect.width;
    const mx=(clientX-rect.left)*scaleX;
    let idx=Math.round((mx-PL)/((W-PL-PR)/n)-0.5);
    idx=Math.max(0,Math.min(n-1,idx));
    const x=X(idx);
    document.getElementById("revCross").setAttribute("x1",x);
    document.getElementById("revCross").setAttribute("x2",x);
    document.getElementById("revCross").style.display="block";
    const r=rev[idx];
    document.getElementById("revTip").innerHTML=
      `<b>${labels[idx]}</b> 營收 <b style="color:#8b7cd8">${bars[idx].toFixed(2)}億</b> 年增率 <b style="color:#d64545">${r.yoy!=null?r.yoy+'%':'-'}</b>`;
  }
  svgEl.addEventListener("mousemove",e=>moveHandler(e.clientX));
  svgEl.addEventListener("touchmove",e=>{e.preventDefault();moveHandler(e.touches[0].clientX)},{passive:false});
  svgEl.addEventListener("touchstart",e=>moveHandler(e.touches[0].clientX));
  svgEl.addEventListener("mouseleave",()=>{
    document.getElementById("revCross").style.display="none";
    document.getElementById("revTip").textContent="滑過圖表查看數值";
  });
}

function drawMarginChart(fin){
  const box=document.getElementById("fc2");
  if(!fin.length){box.innerHTML='<div class="ph">無財報資料</div>';return}
  const W=520,H=200,PL=42,PR=15,PT=20,PB=30;
  const gm=fin.map(f=>f.gross_margin), om=fin.map(f=>f.op_margin);
  const all=[...gm,...om].filter(v=>v!=null);
  if(!all.length){box.innerHTML='<div class="ph">無財報資料</div>';return}
  let lo=Math.min(...all),hi=Math.max(...all);
  const pad=(hi-lo)*0.15||5; lo-=pad; hi+=pad;
  const n=fin.length;
  const X=i=>PL+i*(W-PL-PR)/(n-1||1);
  const Y=v=>H-PB-(v-lo)/(hi-lo)*(H-PT-PB);
  const line=(arr,col)=>{
    const pts=arr.map((v,i)=>v==null?null:`${X(i)},${Y(v)}`).filter(Boolean).join(" ");
    return `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.2"/>`;
  };
  let grid="";
  for(let i=0;i<=3;i++){
    const v=lo+(hi-lo)*i/3, y=Y(v);
    grid+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#1e2a3d"/>
           <text x="${PL-5}" y="${y+4}" font-size="11" fill="#9aa0a8" text-anchor="end">${v.toFixed(0)}</text>`;
  }
  let xlabels="";
  for(let i=0;i<n;i+=Math.ceil(n/6)){
    xlabels+=`<text x="${X(i)}" y="${H-8}" font-size="11" fill="#9aa0a8" text-anchor="middle">${fin[i].date.slice(0,7)}</text>`;
  }
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;cursor:crosshair" id="finSvg">
    ${grid}${line(gm,"#6b5ce7")}${line(om,"#5b9bd5")}${xlabels}
    <g font-size="12" font-weight="700"><text x="${PL}" y="14" fill="#6b5ce7">■ 毛利率</text>
    <text x="${PL+62}" y="14" fill="#5b9bd5">■ 營益率</text></g>
    <line id="finCross" x1="0" y1="${PT}" x2="0" y2="${H-PB}" stroke="#c0c4cb" stroke-width="1" style="display:none"/>
  </svg>
  <div id="finTip" class="tip">滑過圖表查看數值</div>`;

  const svgEl=document.getElementById("finSvg");
  function moveHandler(clientX){
    const rect=svgEl.getBoundingClientRect();
    const scaleX=W/rect.width;
    const mx=(clientX-rect.left)*scaleX;
    let idx=Math.round((mx-PL)/((W-PL-PR)/(n-1||1)));
    idx=Math.max(0,Math.min(n-1,idx));
    const x=X(idx);
    document.getElementById("finCross").setAttribute("x1",x);
    document.getElementById("finCross").setAttribute("x2",x);
    document.getElementById("finCross").style.display="block";
    const f=fin[idx];
    document.getElementById("finTip").innerHTML=
      `<b>${f.date.slice(0,7)}</b> 毛利率 <b style="color:#6b5ce7">${f.gross_margin??'-'}%</b> 營益率 <b style="color:#5b9bd5">${f.op_margin??'-'}%</b>`;
  }
  svgEl.addEventListener("mousemove",e=>moveHandler(e.clientX));
  svgEl.addEventListener("touchmove",e=>{e.preventDefault();moveHandler(e.touches[0].clientX)},{passive:false});
  svgEl.addEventListener("touchstart",e=>moveHandler(e.touches[0].clientX));
  svgEl.addEventListener("mouseleave",()=>{
    document.getElementById("finCross").style.display="none";
    document.getElementById("finTip").textContent="滑過圖表查看數值";
  });
}

function draw(){
  if(charts.length){
    try{const r=charts[0].timeScale().getVisibleLogicalRange();if(r)savedRange=r;}catch(e){}
  }
  charts.forEach(c=>{try{c.remove()}catch(e){}});charts=[];
  const bars=bakBars();
  const closes=bars.map(b=>b.close);
  const isMobile=window.innerWidth<=900;
  const H=fs?window.innerHeight*0.5:(isMobile?Math.max(200,window.innerHeight*0.32):400);
  const opt={layout:{background:{color:"#131c2b"},textColor:"#8fa0b8",fontSize:isMobile?13:11},
    grid:{vertLines:{color:"#1c2739"},horzLines:{color:"#1c2739"}},
        rightPriceScale:{borderColor:"#26344a",minimumWidth:64},timeScale:{borderColor:"#26344a"},
    crosshair:{mode:LightweightCharts.CrosshairMode.Magnet,
      vertLine:{color:"#8fa0b8",width:1,style:LightweightCharts.LineStyle.Dashed,labelBackgroundColor:"#3b82f6"},
      horzLine:{color:"#8fa0b8",width:1,style:LightweightCharts.LineStyle.Dashed,labelBackgroundColor:"#3b82f6"}},
    handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:false},
    handleScale:{axisPressedMouseMove:{time:true,price:false},pinch:true,mouseWheel:true},
    kineticScroll:{mouse:false,touch:false}};
  const c1=LightweightCharts.createChart(document.getElementById("c1"),{...opt,height:H,timeScale:{...opt.timeScale,visible:false}});
  
  const cs=c1.addCandlestickSeries({upColor:"#d64545",downColor:"#2e9e5b",
    borderUpColor:"#d64545",borderDownColor:"#2e9e5b",wickUpColor:"#d64545",wickDownColor:"#2e9e5b"});
  cs.setData(bars);

  const dedSeries = MA_OPTIONS.map(([n,col])=>{
    const sr=c1.addLineSeries({
      color:col,lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,
      priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,
      autoscaleInfoProvider:()=>null,
      visible: maOn.has(n)
    });
    return {n,col,sr};
  });

  const mas = MA_OPTIONS.map(([n,col])=>{
    const sr=c1.addLineSeries({
      color:col,lineWidth:1.4,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,
      visible: maOn.has(n)
    });
    sr.setData(MA(closes,n).map((v,i)=>v==null?null:{time:bars[i].time,value:v}).filter(Boolean));
    return {n,col,sr};
  });

  window.goToLatest = () => {
    const r = {from: Math.max(0, bars.length-120), to: bars.length};
    window.syncLock = true; 
    charts.forEach(c => {
      try { c.timeScale().setVisibleLogicalRange(r); } catch(e){}
    });
    savedRange = r;
    setTimeout(() => { window.syncLock = false; }, 50);
  };

  window.toggleMaVisibility = (maNum, isVisible) => {
    const ma = mas.find(m => m.n === maNum);
    if (ma) ma.sr.applyOptions({ visible: isVisible });
    const ded = dedSeries.find(d => d.n === maNum);
    if (ded) ded.sr.applyOptions({ visible: isVisible });

    const idx = lastHover >= 0 ? lastHover : bars.length - 1;
    document.getElementById("lg1").innerHTML = maLegend(mas.filter(m => maOn.has(m.n)), idx, bars);
    currentDedHover = -1; 
    updateAll(idx);
  };

  const dedRowEl=document.getElementById("dedrow");
  
  let updTimer=null,lastHover=-1;
  let currentHiIdx = -1;
  let currentLoIdx = -1;
  let currentDedHover = -1;

  function updateAll(hoverIdx){
    lastHover=hoverIdx;
    if(hoverIdx<0){
      const r=c1.timeScale().getVisibleLogicalRange();
      hoverIdx=r?Math.min(bars.length-1,Math.round(r.to)):bars.length-1;
    }
    
    // 波段高低點
    const range=c1.timeScale().getVisibleLogicalRange();
    if(range){
      const from=Math.max(0,Math.floor(range.from));
      const to=Math.min(bars.length-1,Math.ceil(range.to));
      if(to>=from&&bars.length>0){
        let hiIdx=from,loIdx=from;
        for(let i=from;i<=to;i++){
          if(bars[i].high>bars[hiIdx].high)hiIdx=i;
          if(bars[i].low<bars[loIdx].low)loIdx=i;
        }
        if (hiIdx !== currentHiIdx || loIdx !== currentLoIdx) {
           currentHiIdx = hiIdx;
           currentLoIdx = loIdx;
           cs.setMarkers([
             {time:bars[hiIdx].time,position:"aboveBar",color:"#d64545",shape:"circle",size:0,text:bars[hiIdx].high.toFixed(2)},
             {time:bars[loIdx].time,position:"belowBar",color:"#3a3f47",shape:"circle",size:0,text:bars[loIdx].low.toFixed(2)},
           ]);
        }
      }
    }

    // 扣抵虛線與三角形
        if (hoverIdx !== currentDedHover) {
       currentDedHover = hoverIdx;
       dedSeries.forEach(({n,sr})=>{
         if(!maOn.has(n)) return;
         const idx=hoverIdx-n;
         if(idx>=0&&idx<bars.length){
           const price=bars[idx].close;
           sr.setData([
             {time:bars[idx].time,value:price},
             {time:bars[hoverIdx].time,value:price}
           ]);
         }else{
           sr.setData([]);
         }
       });
    }

    // 三角形每次都要重算：拖曳縮放時像素位置會變
    if(dedRowEl){
      const rowW=dedRowEl.clientWidth||1;
      let html="";
      dedSeries.forEach(({n,col})=>{
        if(!maOn.has(n)) return;
        const idx=hoverIdx-n;
        if(idx>=0&&idx<bars.length){
          const x=c1.timeScale().timeToCoordinate(bars[idx].time);
          if(x!=null&&x>=0&&x<=rowW){
            html+=`<div class="dedtri" style="left:${x}px;border-bottom:8px solid ${col}"></div>`;
          }
        }
      });
      dedRowEl.innerHTML=html;
    }

  }

  charts.push(c1);

  const c2=LightweightCharts.createChart(document.getElementById("c2"),{...opt,height:fs?130:110,timeScale:{...opt.timeScale,visible:false},crosshair:{mode:LightweightCharts.CrosshairMode.Normal,horzLine:{visible:false,labelVisible:false}}});
  const vs=c2.addHistogramSeries({priceFormat:{type:"volume"}});
  vs.setData(bars.map(b=>({time:b.time,value:b.volume,color:b.close>=b.open?"#e8a0a0":"#96ccae"})));
  charts.push(c2);

  // ── 法人籌碼：外資、投信各一張 ──────────────
  const rawBars=toBars(raw);
  const instMap={};
  (raw&&raw.d||[]).forEach((dt,i)=>{
    const t=rawBars[i]&&rawBars[i].time;
    if(!t)return;
    instMap[t]={fi:(raw.fi&&raw.fi[i])||0,it:(raw.it&&raw.it[i])||0};
  });
  const instAgg=bars.map(b=>{
    const v=instMap[b.time]||{fi:0,it:0};
    return {time:b.time,fi:v.fi,it:v.it};
  });

  // c4：外資買賣超
  const c4=LightweightCharts.createChart(document.getElementById("c4"),{...opt,height:fs?130:110,timeScale:{...opt.timeScale,visible:false},crosshair:{mode:LightweightCharts.CrosshairMode.Normal,horzLine:{visible:false,labelVisible:false}}});
  charts.push(c4);
  const fiSr=c4.addHistogramSeries({priceFormat:{type:"volume"},base:0});
  fiSr.setData(instAgg.map(x=>({time:x.time,value:x.fi,
    color:x.fi>=0?"#ef4444":"#22c55e"})));
  c4.priceScale("right").applyOptions({scaleMargins:{top:0.12,bottom:0.12}});

  // c5：投信買賣超
  const c5=LightweightCharts.createChart(document.getElementById("c5"),{...opt,height:fs?130:110,timeScale:{...opt.timeScale,visible:false},crosshair:{mode:LightweightCharts.CrosshairMode.Normal,horzLine:{visible:false,labelVisible:false}}});
  charts.push(c5);
  const itSr=c5.addHistogramSeries({priceFormat:{type:"volume"},base:0});
  itSr.setData(instAgg.map(x=>({time:x.time,value:x.it,
    color:x.it>=0?"#ef4444":"#22c55e"})));
  c5.priceScale("right").applyOptions({scaleMargins:{top:0.12,bottom:0.12}});

  const c3=LightweightCharts.createChart(document.getElementById("c3"),{...opt,height:fs?160:130,crosshair:{mode:LightweightCharts.CrosshairMode.Normal,horzLine:{visible:false,labelVisible:false}}});
  let s3=[];
  if(sub==="KD"){
    const {k,d}=calcKD(bars);
    const sk=c3.addLineSeries({color:"#e8734a",lineWidth:1.4});
    const sd=c3.addLineSeries({color:"#5b9bd5",lineWidth:1.4});
    sk.setData(k.map((v,i)=>({time:bars[i].time,value:v})));
    sd.setData(d.map((v,i)=>({time:bars[i].time,value:v})));
    s3=[{n:"K",col:"#e8734a",sr:sk},{n:"D",col:"#5b9bd5",sr:sd}];
  }else if(sub==="MACD"){
    const {dif,dea,osc}=calcMACD(closes);
    const so=c3.addHistogramSeries({});
    so.setData(osc.map((v,i)=>({time:bars[i].time,value:v,color:v>=0?"#e8a0a0":"#96ccae"})));
    const s1=c3.addLineSeries({color:"#e8734a",lineWidth:1.3});
    const s2=c3.addLineSeries({color:"#5b9bd5",lineWidth:1.3});
    s1.setData(dif.map((v,i)=>({time:bars[i].time,value:v})));
    s2.setData(dea.map((v,i)=>({time:bars[i].time,value:v})));
    s3=[{n:"DIF",col:"#e8734a",sr:s1},{n:"MACD",col:"#5b9bd5",sr:s2}];
  }else{
    const r=calcRSI(closes);
    const sr=c3.addLineSeries({color:"#8b6fd4",lineWidth:1.4});
    sr.setData(r.map((v,i)=>({time:bars[i].time,value:v})));
    s3=[{n:"RSI",col:"#8b6fd4",sr}];
  }
  charts.push(c3);

  window.syncLock=false;
  const sync=(a,others)=>a.timeScale().subscribeVisibleLogicalRangeChange(r=>{
    if(window.syncLock||!r)return;
    window.syncLock=true;
    others.forEach(o=>{try{o.timeScale().setVisibleLogicalRange(r)}catch(e){}});
    setTimeout(() => { window.syncLock = false; }, 10);
  });
  sync(c1,[c2,c3,c4,c5]);sync(c2,[c1,c3,c4,c5]);sync(c3,[c1,c2,c4,c5]);sync(c4,[c1,c2,c3,c5]);sync(c5,[c1,c2,c3,c4]);
  
  const crossList=[{c:c1,s:cs},{c:c2,s:vs},{c:c4,s:fiSr},{c:c5,s:itSr},{c:c3,s:s3[0].sr}];
  let crossLock=false;
  crossList.forEach(({c})=>{
    c.subscribeCrosshairMove(p=>{
      if(crossLock)return;
      crossLock=true;
      crossList.forEach(t=>{
        if(t.c===c)return;
        if(!p.time)t.c.clearCrosshairPosition();
        else t.c.setCrosshairPosition(0,p.time,t.s);
      });
      crossLock=false;
    });
  });

  const fmtLot=v=>(v>=0?"+":"")+v.toLocaleString(undefined,{maximumFractionDigits:1});

  function fiLegend(i){
    if(i<0||!instAgg[i])return `<span style="color:#8fa0b8">外資買賣超(張)</span>`;
    const v=instAgg[i].fi;
    return `<span style="color:#8fa0b8">外資</span> `+
           `<span style="color:${v>=0?"#ef4444":"#22c55e"}">${fmtLot(v)}</span> `+
           `<span style="color:#8fa0b8">張</span>`;
  }
  function itLegend(i){
    if(i<0||!instAgg[i])return `<span style="color:#8fa0b8">投信買賣超(張)</span>`;
    const v=instAgg[i].it;
    return `<span style="color:#8fa0b8">投信</span> `+
           `<span style="color:${v>=0?"#ef4444":"#22c55e"}">${fmtLot(v)}</span> `+
           `<span style="color:#8fa0b8">張</span>`;
  }

  function subLegend(i){
    if(i<0)return s3.map(x=>`<span style="color:${x.col}">${x.n}</span>`).join(" ");
    return s3.map(x=>{
      const d=x.sr.data?x.sr.data():null;
      let v=null;
      if(d&&d[i]!=null)v=d[i].value!=null?d[i].value:null;
      return `<span style="color:${x.col}">${x.n} ${v!=null?v.toFixed(2):"-"}</span>`;
    }).join(" ");
  }

  function setLegends(i){
    document.getElementById("lg2").innerHTML=
      i>=0&&bars[i]?`量 ${bars[i].volume.toLocaleString()} 張`:"成交量(張)";
    document.getElementById("lg4").innerHTML=fiLegend(i);
    document.getElementById("lg5").innerHTML=itLegend(i);
    document.getElementById("lg3").innerHTML=subLegend(i);
  }

  c1.subscribeCrosshairMove(p=>{
    const lg=document.getElementById("lg1");
    if(!p.time){
      const last=bars.length-1;
      lg.innerHTML=maLegend(mas.filter(m => maOn.has(m.n)),last,bars);
      setLegends(last);
      clearTimeout(updTimer);
      updTimer=setTimeout(()=>updateAll(last),50);
      return;
    }
    const b=p.seriesData.get(cs);if(!b)return;
    const i=bars.findIndex(x=>x.time===p.time);
    const up=b.close>=b.open?"#d64545":"#2e9e5b";
    lg.innerHTML=`<span style="color:${up}">${p.time} 開 ${b.open} 高 ${b.high} 低 ${b.low} 收 ${b.close}</span><br>${maLegend(mas.filter(m => maOn.has(m.n)),i,bars)}`;
    setLegends(i);
    if(i>=0){
      clearTimeout(updTimer);
      updTimer=setTimeout(()=>updateAll(i),50);
    }
  });

  c1.timeScale().subscribeVisibleLogicalRangeChange(r=>{
    if(r)savedRange=r;
    clearTimeout(updTimer);
      updTimer=setTimeout(()=>updateAll(-1),200);
  });

  document.getElementById("lg1").innerHTML=maLegend(mas.filter(m => maOn.has(m.n)),bars.length-1,bars);
  setLegends(bars.length-1);

  if(savedRange){
    try{c1.timeScale().setVisibleLogicalRange(savedRange);}
    catch(e){c1.timeScale().setVisibleLogicalRange({from:Math.max(0,bars.length-120),to:bars.length});}
  }else{
    c1.timeScale().setVisibleLogicalRange({from:Math.max(0,bars.length-120),to:bars.length});
  }
  setTimeout(()=>updateAll(bars.length-1),150);
}

function maLegend(mas,i,bars){
  return mas.map(m=>{
    let v = null;
    if(i >= m.n - 1) {
      let sum = 0;
      for(let j=0; j<m.n; j++) sum += bars[i-j].close;
      v = sum / m.n;
    }
    return `<span style="color:${m.col}">MA${m.n} ${v==null?"-":v.toFixed(2)}</span>`;
  }).join(" ");
}

let lastW=window.innerWidth,resizeTimer=null;
window.addEventListener("resize",()=>{
  if(!raw||mainTab!=="chart")return;
  if(window.innerWidth===lastW)return;
  lastW=window.innerWidth;
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{if(raw&&mainTab==="chart")draw()},250);
});
</script>
</body>
</html>
